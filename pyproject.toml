[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parserf"
version = "0.1.0"
description = "Parser for earthquake rupture forecasts like UCERF3 and 2023 NSHMP."
authors = [
    { name = "Alex Sarmiento" , email = "asarmy@ucla.edu" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["ERF", "earthquake rupture forecast", "UCERF3", "NSHM", "seismic hazard"]
requires-python = ">=3.12"
dependencies = [
    "geopandas",
    "numpy>=2.4.0",
    "pandas",
    "pyarrow>=23.0.1",
    "pyproj",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
examples = [
    "ipykernel>=7.2.0",
    "jupyterlab",
    "matplotlib",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov",
    "ruff>=0.14.10",
]
docs = [
    "myst-nb",
    "renku-sphinx-theme",
    "sphinx",
]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that load full fault model datasets",
]

[tool.coverage.run]
relative_files = true

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
