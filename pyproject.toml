[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parserf"
version = "0.1.0"
description = "Library for parsing earthquake rupture forecast (ERF) datasets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "geopandas",
  "matplotlib",
  "numpy",
  "pandas",
  "pyarrow>=23.0.1",
  "pyproj",
  "scipy",
  "shapely",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest>=9.0.2",
  "pytest-cov",
  "ruff",
]
examples = [
  "jupyterlab",
  "ipykernel>=7.2.0",
]

[project.urls]
Repository = "https://github.com/asarmy/parserf"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load all three fault models (deselect with '-m not slow')",
]

[tool.coverage.run]
relative_files = true

[tool.ruff]
line-length = 99
target-version = "py312"
exclude = ["scratch.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
