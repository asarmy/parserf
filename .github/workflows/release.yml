name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run pytest -q

  publish:
    needs: test # publish only if tests pass
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mints the OIDC token PyPI trusts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"          # strip optional leading "v"
          PKG="$(uv version --short)"
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) != pyproject version ($PKG). Bump pyproject.toml and re-tag."
            exit 1
          fi
      - name: Check if version already published to PyPI
        id: check_pypi
        run: |
          PKG="$(uv version --short)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/parserf/$PKG/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::parserf $PKG is already on PyPI — skipping build/publish. (Re-publishing a GitHub Release, e.g. to trigger Zenodo, doesn't re-upload to PyPI.)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build sdist + wheel
        if: steps.check_pypi.outputs.exists != 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.check_pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
