repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: coverage-badge
        name: coverage-badge
        entry: bash -c 'uv run pytest --cov=parserf --cov-report=term-missing && uv run coverage-badge -f -o coverage.svg && git add coverage.svg'
        language: system
        always_run: true
        pass_filenames: false
